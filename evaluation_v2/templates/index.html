<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evaluation der Chatbot-Antworten</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <main class="page page-centered">
        <section class="card start-card">
            <p class="eyebrow">Bachelorarbeit</p>
            <h1>Evaluation der Chatbot-Antworten</h1>
            <p class="lead">
                Bewerten Sie zehn zufällig ausgewählte Chatbot-Antworten.

            </p>

            <form method="post" action="/start">
                <button class="button button-primary" type="submit">
                    Evaluation starten
                </button>
            </form>
        </section>
    </main>
